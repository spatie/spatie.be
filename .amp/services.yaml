services:
  web:
    command: >-
      php artisan config:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /
    portal:
      title: Spatie
      description: Local development database. Run npm run build after changing frontend assets.
