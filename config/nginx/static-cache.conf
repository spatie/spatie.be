# Include this in the production server block before the PHP location.
# Laravel's public/.htaccess is not used when nginx serves static files directly.

location ^~ /build/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* ^/fonts/.*\.woff2$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
